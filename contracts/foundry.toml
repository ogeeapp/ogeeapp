[profile.default]
src = "src"
out = "out"
cache_path = "cache"
libs = ["lib"]
test = "test"
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "cancun"
# Vendored without git metadata using forge install --no-git:
# OpenZeppelin contracts and contracts-upgradeable v5.4.0; forge-std v1.9.7.
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
  "ogee-contracts/=src/",
  "forge-std/=lib/forge-std/src/",
]

[invariant]
runs = 50
depth = 20
